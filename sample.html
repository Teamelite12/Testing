<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dialog-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .dialog-overlay.active {
            display: flex;
        }
        .dialog-box {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            min-width: 300px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            text-align: center;
        }
        .dialog-box p {
            margin: 0 0 20px;
            font-size: 1rem;
        }
        .dialog-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .dialog-actions button {
            padding: 8px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        #confirmBtn { background: #0066cc; color: #fff; }
        #confirmBtn:hover { background: #0052a3; }
        #cancelBtn { background: #e0e0e0; color: #333; }
        #cancelBtn:hover { background: #c8c8c8; }
    </style>
</head>
<body>
    
    <h1>djfhbdj</h1>

    <button onclick="showDialog()">Delete item</button>

    <div class="dialog-overlay" id="dialogOverlay">
        <div class="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialogMsg">
            <p id="dialogMsg">Are you sure you want to delete this item?</p>
            <div class="dialog-actions">
                <button id="confirmBtn" onclick="handleConfirm()">OK</button>
                <button id="cancelBtn" onclick="hideDialog()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        function showDialog() {
            document.getElementById('dialogOverlay').classList.add('active');
        }

        function hideDialog() {
            document.getElementById('dialogOverlay').classList.remove('active');
        }

        function handleConfirm() {
            hideDialog();
            alert('Item deleted.');
        }

        document.getElementById('dialogOverlay').addEventListener('click', function(e) {
            if (e.target === this) hideDialog();
        });
    </script>
</body>
</html>
